apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: agenticai

resources:
  - namespace.yaml
  - configmap.yaml
  - secret.yaml
  - rbac.yaml
  - deployment.yaml
  - hpa.yaml
  - servicemonitor.yaml
  - prometheusrule.yaml
  - backup/cronjob.yaml
  - backup/restore.yaml

commonLabels:
  app.kubernetes.io/managed-by: kustomize
  app.kubernetes.io/part-of: agenticai-platform