apiVersion: v1
kind: ServiceAccount
metadata:
  name: agenticai
  namespace: agenticai
  labels:
    app.kubernetes.io/name: agenticai
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: agenticai
  namespace: agenticai
  labels:
    app.kubernetes.io/name: agenticai
rules:
  - apiGroups: [""]
    resources: ["configmaps", "secrets"]
    verbs: ["get", "list", "watch"]
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: agenticai
  namespace: agenticai
  labels:
    app.kubernetes.io/name: agenticai
subjects:
  - kind: ServiceAccount
    name: agenticai
    namespace: agenticai
roleRef:
  kind: Role
  name: agenticai
  apiGroup: rbac.authorization.k8s.io