apiVersion: v1
kind: Secret
metadata:
  name: agenticai-secrets
  namespace: agenticai
  labels:
    app.kubernetes.io/name: agenticai
    app.kubernetes.io/component: secrets
type: Opaque
stringData:
  # Database password (replace with actual value or use secrets manager)
  DB_PASSWORD: "changeme"
  # JWT secret key for token signing
  SECRET_KEY: "change-me-in-production-use-secrets-manager"
  # Stripe keys (optional)
  STRIPE_SECRET_KEY: ""
  STRIPE_WEBHOOK_SECRET: ""
  # Domain for CORS and callbacks
  DOMAIN: "http://localhost:3000"
  # External API keys (replace with actual values or use secrets manager)
  OPENAI_API_KEY: ""
  ANTHROPIC_API_KEY: ""
  TAVILY_API_KEY: ""
  # Azure OpenAI (if using)
  AZURE_OPENAI_ENDPOINT: ""
  AZURE_OPENAI_API_KEY: ""
  AZURE_OPENAI_DEPLOYMENT: ""
  # AWS credentials (if using AWS integrations)
  AWS_ACCESS_KEY_ID: ""
  AWS_SECRET_ACCESS_KEY: ""
  AWS_REGION: "us-east-1"
  # HashiCorp Vault (if using Vault secrets manager)
  VAULT_ADDR: ""
  VAULT_TOKEN: ""
  # Azure Key Vault (if using)
  AZURE_KEY_VAULT_URL: ""