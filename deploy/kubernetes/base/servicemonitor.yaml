apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: agenticai-api
  namespace: agenticai
  labels:
    app.kubernetes.io/name: agenticai
    app.kubernetes.io/component: api
    release: prometheus
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: agenticai
      app.kubernetes.io/component: api
  endpoints:
    - port: http
      path: /api/v1/observability/metrics/prometheus
      interval: 30s
      scheme: http
  namespaceSelector:
    matchNames:
      - agenticai