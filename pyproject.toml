[project]
name = "agenticai-sdk"
version = "0.1.0"
description = "Production-grade JSON-to-Workflow Engine SDK — compile declarative JSON into async, resilient, multi-agent DAGs powered by LangGraph and DeepAgent."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.7,<3.0",
    "pydantic-settings>=2.3,<3.0",
    "langchain>=0.3,<1.0",
    "langchain-core>=0.3,<1.0",
    "langchain-openai>=0.3,<1.0",
    "langchain-anthropic>=0.3,<1.0",
    "langchain-community>=0.3,<1.0",
    "langgraph>=0.4,<1.0",
    "langgraph-checkpoint>=2.0,<3.0",
    "fastapi>=0.115,<1.0",
    "uvicorn[standard]>=0.30,<1.0",
    "httpx[http2]>=0.27,<1.0",
    "structlog>=24.0,<26.0",
    "tenacity>=9.0,<10.0",
    "qdrant-client>=1.9,<3.0",
    "pinecone-client>=4.0,<7.0",
    "chromadb>=0.5,<1.0",
    "faiss-cpu>=1.8,<2.0",
    "tiktoken>=0.7,<1.0",
    "sqlalchemy>=2.0,<3.0",
    "boto3>=1.34,<2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "httpx>=0.27",
    "ruff>=0.4",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["agenticai_sdk*"]

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[dependency-groups]
dev = [
    "pytest>=9.0.3",
    "pytest-asyncio>=1.3.0",
]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
